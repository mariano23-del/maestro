<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maestro - Estúdio Gospel Contemporâneo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0A0A0F;
    --surface: #1A1B2E;
    --primary: #7C3AED;
    --primary-light: #A78BFA;
    --sagrado: #FBBF24;
    --espirito: #10B981;
    --texto: #F8FAFC;
    --texto-sub: #94A3B8;
    --texto-fraco: #64748B;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(180deg, #0A0A0F 0%, #2E1065 100%);
    min-height: 100vh;
    color: var(--texto);
    padding-bottom: 80px;
    overflow-x: hidden;
  }
  .header {
    padding: 20px 20px 12px;
    position: sticky; top: 0;
    background: rgba(10,10,15,0.95);
    backdrop-filter: blur(20px);
    z-index: 100;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    display: flex; align-items: center; gap: 12px;
  }
  .header .voltar {
    background: rgba(255,255,255,0.08); border: none;
    color: var(--texto); padding: 8px 14px; border-radius: 10px;
    font-size: 16px; cursor: pointer; display: none;
  }
  .header .voltar.ativo { display: block; }
  .header h1 { font-size: 20px; font-weight: 800; }
  .container { padding: 16px 20px; max-width: 720px; margin: 0 auto; }
  .hero { padding: 20px 0 30px; }
  .hero h1 { font-size: 44px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
  .hero p { color: var(--texto-sub); font-size: 14px; margin-top: 8px; }
  .card {
    background: rgba(255,255,255,0.04);
    border-radius: 14px; padding: 18px; margin-bottom: 10px;
    border: 1px solid rgba(255,255,255,0.06);
    border-left-width: 4px; cursor: pointer;
    transition: all 0.2s;
  }
  .card:hover { background: rgba(255,255,255,0.08); transform: translateX(2px); }
  .card:active { transform: scale(0.98); }
  .card h3 { font-size: 16px; font-weight: 700; color: var(--texto); }
  .card p { font-size: 12px; color: var(--texto-sub); margin-top: 4px; }
  .card.voz { border-left-color: #F43F5E; }
  .card.roxa { border-left-color: #6366F1; }
  .card.arr { border-left-color: #8B5CF6; }
  .card.lab { border-left-color: #EC4899; }
  .card.bib { border-left-color: #0EA5E9; }
  .card.des { border-left-color: #F59E0B; }
  .card.fer { border-left-color: #F472B6; }
  .card.mem { border-left-color: #A855F7; }
  .card.das { border-left-color: #38BDF8; }
  .card.conf { border-left-color: #64748B; }

  .avat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 12px; }
  .avat {
    background: rgba(255,255,255,0.04); border-radius: 12px;
    padding: 10px; text-align: center; cursor: pointer;
    border: 2px solid rgba(255,255,255,0.06);
    transition: all 0.15s;
  }
  .avat:active { transform: scale(0.95); }
  .avat.ativo { border-width: 3px; }
  .avat.falando { animation: pulse 1s infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(244,63,94,0.7); }
    50% { box-shadow: 0 0 0 12px rgba(244,63,94,0); }
  }
  .avat .emoji { font-size: 24px; }
  .avat .nome { font-size: 12px; font-weight: 700; margin-top: 4px; }
  .avat .naipe { font-size: 9px; font-weight: 700; margin-top: 2px; }
  .avat .tess { font-size: 9px; color: var(--texto-fraco); margin-top: 3px; }

  .chat-box {
    background: rgba(0,0,0,0.3); border-radius: 12px;
    padding: 14px; min-height: 240px; max-height: 400px;
    overflow-y: auto; margin: 12px 0;
  }
  .msg {
    padding: 10px 14px; border-radius: 12px;
    margin-bottom: 8px; max-width: 88%;
    font-size: 13px; line-height: 1.45;
    word-wrap: break-word;
  }
  .msg.eu { background: var(--primary); margin-left: auto; }
  .msg.avatar { background: rgba(255,255,255,0.06); position: relative; }
  .msg.sistema { background: rgba(251,191,36,0.15); color: var(--sagrado); font-size: 11px; font-style: italic; text-align: center; margin: 8px auto; max-width: 100%; }
  .msg .btn-falar {
    background: rgba(244,63,94,0.15); border: none; color: #F43F5E;
    padding: 4px 10px; border-radius: 8px; font-size: 11px;
    font-weight: 700; cursor: pointer; margin-top: 6px;
    display: inline-block;
  }
  .msg .btn-falar:hover { background: rgba(244,63,94,0.3); }
  .msg.falando { border-left: 3px solid #F43F5E; }

  .input-row { display: flex; gap: 8px; margin-top: 8px; }
  .input-row input {
    flex: 1; background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--texto); padding: 12px 14px;
    border-radius: 10px; font-size: 14px; outline: none;
  }
  .input-row input:focus { border-color: var(--primary); }
  .btn {
    background: var(--primary); border: none;
    color: white; padding: 12px 20px;
    border-radius: 10px; font-weight: 800;
    cursor: pointer; font-size: 14px;
    transition: all 0.15s;
  }
  .btn:active { transform: scale(0.96); }
  .btn:hover { background: #6D28D9; }
  .btn.verde { background: var(--espirito); }
  .btn.verde:hover { background: #059669; }
  .btn.vermelho { background: #EF4444; }
  .btn.vermelho:hover { background: #DC2626; }
  .btn.rosa { background: #F43F5E; }
  .btn.rosa:hover { background: #E11D48; }
  .btn.sec { background: rgba(255,255,255,0.08); }
  .btn.sec:hover { background: rgba(255,255,255,0.15); }
  .btn.gravando { animation: recording 1s infinite; }
  @keyframes recording {
    0%, 100% { background: #F43F5E; }
    50% { background: #EF4444; }
  }
  .btn-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  .piano-wrap {
    overflow-x: auto; padding: 12px 0;
    -webkit-overflow-scrolling: touch; margin: 12px 0;
  }
  .piano { display: flex; position: relative; height: 140px; padding: 0 6px; min-width: fit-content; }
  .tecla-branca {
    width: 34px; height: 140px;
    background: #F8FAFC; border: 1px solid #334155;
    border-radius: 0 0 6px 6px;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 8px; cursor: pointer;
    font-size: 9px; font-weight: 700; color: #0F172A;
    margin-right: 2px; transition: all 0.05s;
    user-select: none;
  }
  .tecla-branca:active { background: #CBD5E1; transform: translateY(2px); }
  .tecla-branca.ativa { background: var(--primary); color: white; }
  .tecla-preta {
    position: absolute; width: 22px; height: 88px;
    background: #1E293B; border-radius: 0 0 4px 4px;
    cursor: pointer; z-index: 10; top: 0;
    transition: all 0.05s; user-select: none;
  }
  .tecla-preta:active { background: #334155; transform: translateY(2px); }
  .tecla-preta.ativa { background: var(--primary); }

  .metronomo {
    background: rgba(255,255,255,0.04);
    padding: 20px; border-radius: 16px; margin-bottom: 16px;
  }
  .metronomo .bolinhas { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
  .bolinha {
    width: 20px; height: 20px; border-radius: 10px;
    background: rgba(255,255,255,0.1);
    transition: all 0.1s;
  }
  .bolinha.ativa { background: var(--primary); transform: scale(1.2); }
  .bolinha.forte { background: var(--sagrado); }
  .metronomo .bpm-display { font-size: 56px; font-weight: 800; text-align: center; }
  .metronomo .bpm-label { text-align: center; font-size: 11px; letter-spacing: 2px; color: var(--texto-sub); margin-bottom: 12px; }
  .bpm-slider { width: 100%; margin: 12px 0; accent-color: var(--primary); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .chip {
    background: rgba(255,255,255,0.05);
    padding: 8px 14px; border-radius: 8px;
    font-size: 12px; font-weight: 700;
    cursor: pointer; border: 1px solid transparent;
    transition: all 0.15s;
  }
  .chip:active { transform: scale(0.95); }
  .chip.ativo { background: var(--primary); color: white; }
  .chip:hover { border-color: rgba(255,255,255,0.2); }

  .monitor {
    background: rgba(0,0,0,0.4);
    border-radius: 14px; padding: 16px; margin: 12px 0;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .monitor .nota-grande {
    font-size: 64px; font-weight: 800;
    text-align: center; letter-spacing: -2px;
    line-height: 1; transition: color 0.15s;
  }
  .monitor .cents { text-align: center; font-size: 14px; color: var(--texto-sub); margin-top: 4px; }
  .monitor .freq { text-align: center; font-size: 11px; color: var(--texto-fraco); margin-top: 2px; }
  .medidor { height: 26px; background: rgba(255,255,255,0.05); border-radius: 13px; position: relative; margin-top: 16px; }
  .medidor .centro-linha { position: absolute; left: 50%; width: 2px; height: 100%; background: #475569; }
  .medidor .marcador {
    position: absolute; width: 18px; height: 18px; border-radius: 9px;
    top: 4px; margin-left: -9px; transition: left 0.1s;
  }
  .medidor-legend { display: flex; justify-content: space-between; font-size: 10px; color: var(--texto-fraco); margin-top: 4px; }

  .aula-item {
    background: rgba(255,255,255,0.04);
    padding: 12px 14px; border-radius: 10px;
    margin-bottom: 6px; cursor: pointer;
    transition: background 0.15s;
  }
  .aula-item:hover { background: rgba(255,255,255,0.08); }
  .aula-item .num { font-size: 10px; color: var(--primary-light); font-weight: 700; letter-spacing: 1px; }
  .aula-item .tit { font-size: 14px; font-weight: 600; margin-top: 2px; }

  .config-box {
    background: rgba(251,191,36,0.08);
    border: 1px solid rgba(251,191,36,0.2);
    padding: 14px; border-radius: 12px;
    margin-bottom: 16px;
  }
  .config-box label { display: block; font-size: 12px; color: var(--sagrado); font-weight: 700; margin-bottom: 8px; }
  .config-box input {
    width: 100%; background: rgba(0,0,0,0.4);
    border: 1px solid rgba(251,191,36,0.3);
    color: var(--texto); padding: 10px 12px;
    border-radius: 8px; font-size: 13px;
    font-family: monospace;
  }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.9); color: white;
    padding: 12px 20px; border-radius: 30px;
    font-size: 13px; font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s, bottom 0.3s;
    z-index: 9999; max-width: 90%; text-align: center;
  }
  .toast.show { opacity: 1; bottom: 50px; }

  .sec-title {
    font-size: 12px; color: var(--primary-light);
    font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; margin: 24px 0 12px;
  }
  .small { font-size: 11px; color: var(--texto-fraco); }
  .info-box {
    background: rgba(255,255,255,0.03);
    padding: 14px; border-radius: 12px;
    font-size: 12px; color: var(--texto-sub);
    line-height: 1.6; margin-bottom: 12px;
  }
  .info-box strong { color: var(--sagrado); }

  /* Estilos novos para VOZ */
  .voz-big-btn {
    background: linear-gradient(135deg, #F43F5E, #EC4899);
    color: white; border: none;
    padding: 24px; border-radius: 16px;
    font-size: 18px; font-weight: 800;
    cursor: pointer; width: 100%;
    box-shadow: 0 8px 24px rgba(244,63,94,0.3);
    transition: all 0.2s;
  }
  .voz-big-btn:active { transform: scale(0.97); }
  .voz-big-btn.gravando {
    background: linear-gradient(135deg, #EF4444, #DC2626);
    animation: pulsar 1.2s infinite;
  }
  @keyframes pulsar {
    0%, 100% { box-shadow: 0 8px 24px rgba(239,68,68,0.4); }
    50% { box-shadow: 0 8px 40px rgba(239,68,68,0.8); }
  }
  .transcricao-box {
    background: rgba(244,63,94,0.1);
    border: 1px solid rgba(244,63,94,0.3);
    padding: 14px; border-radius: 12px;
    margin-top: 12px;
    font-size: 14px; color: #FECACA;
    min-height: 60px;
  }
  .transcricao-box.ativa { animation: piscar 1.2s infinite; }
  @keyframes piscar {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }
  .status-voz {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    background: rgba(244,63,94,0.2);
    color: #FECACA;
  }
  .avatar-falando-big {
    display: flex; align-items: center; gap: 12px;
    background: rgba(244,63,94,0.1);
    border: 2px solid #F43F5E;
    padding: 14px; border-radius: 14px;
    margin: 12px 0;
  }
  .avatar-falando-big .emoji-big { font-size: 42px; }
  .avatar-falando-big .onda {
    display: flex; gap: 3px; align-items: center; height: 32px;
  }
  .avatar-falando-big .onda span {
    display: block; width: 4px; background: #F43F5E;
    border-radius: 2px;
    animation: onda 0.8s infinite ease-in-out;
  }
  .avatar-falando-big .onda span:nth-child(2) { animation-delay: 0.1s; }
  .avatar-falando-big .onda span:nth-child(3) { animation-delay: 0.2s; }
  .avatar-falando-big .onda span:nth-child(4) { animation-delay: 0.3s; }
  .avatar-falando-big .onda span:nth-child(5) { animation-delay: 0.4s; }
  @keyframes onda {
    0%, 100% { height: 8px; }
    50% { height: 28px; }
  }
</style>
</head>
<body>

<div class="header">
  <button class="voltar" id="btnVoltar" onclick="voltar()">← Voltar</button>
  <h1 id="headerTitulo">Maestro</h1>
</div>

<div class="container" id="app"></div>
<div class="toast" id="toast"></div>

<script>

const NOTAS_MAP = { C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11 };
const NOTAS_NOME = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

function notaParaFreq(nota) {
  const m = nota.match(/^([A-G][#b]?)(\d)$/);
  if (!m) return 440;
  const semitons = NOTAS_MAP[m[1]];
  const oitava = parseInt(m[2]);
  const semitonsDeA4 = (oitava - 4) * 12 + (semitons - 9);
  return 440 * Math.pow(2, semitonsDeA4 / 12);
}

function freqParaNota(freq) {
  if (freq <= 0) return { nota: '', cents: 0 };
  const A4 = 440;
  const cont = 69 + 12 * Math.log2(freq / A4);
  const midi = Math.round(cont);
  const cents = Math.round((cont - midi) * 100);
  const oitava = Math.floor(midi / 12) - 1;
  return { nota: NOTAS_NOME[midi % 12] + oitava, cents };
}

let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function tocarNota(freq, duracao = 0.7, volume = 0.15, tipo = 'sine') {
  const ctx = getAudio();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = tipo;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(volume, ctx.currentTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duracao);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + duracao);
}

function tocarAcorde(notas, duracao = 1.0) {
  notas.forEach(n => tocarNota(notaParaFreq(n), duracao, 0.12));
}

function tocarNotaTimbre(freq, naipe, duracao = 0.7) {
  const ctx = getAudio();
  const mapa = {
    'Soprano': { tipo: 'sine', vol: 0.12 },
    'Meio-Soprano': { tipo: 'triangle', vol: 0.13 },
    'Contralto': { tipo: 'triangle', vol: 0.14 },
    'Tenor': { tipo: 'sawtooth', vol: 0.08 },
    'Barítono': { tipo: 'sawtooth', vol: 0.07 },
    'Baixo': { tipo: 'sawtooth', vol: 0.06 },
  };
  const cfg = mapa[naipe] || mapa['Tenor'];
  const osc = ctx.createOscillator();
  const osc2 = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = cfg.tipo;
  osc2.type = 'sine';
  osc.frequency.value = freq;
  osc2.frequency.value = freq * 2;
  gain.gain.setValueAtTime(0, ctx.currentTime);
  gain.gain.linearRampToValueAtTime(cfg.vol, ctx.currentTime + 0.03);
  gain.gain.setValueAtTime(cfg.vol, ctx.currentTime + duracao * 0.7);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duracao);
  osc.connect(gain);
  osc2.connect(gain);
  gain.connect(ctx.destination);
  osc.start(); osc2.start();
  osc.stop(ctx.currentTime + duracao);
  osc2.stop(ctx.currentTime + duracao);
}

let vozesDisponiveis = [];

function carregarVozes() {
  if (!('speechSynthesis' in window)) return;
  vozesDisponiveis = window.speechSynthesis.getVoices();
  if (vozesDisponiveis.length === 0) {
    window.speechSynthesis.onvoiceschanged = () => {
      vozesDisponiveis = window.speechSynthesis.getVoices();
    };
  }
}

function escolherVoz(genero) {
  // Prioriza vozes em PT-BR
  const ptBr = vozesDisponiveis.filter(v => v.lang === 'pt-BR' || v.lang.startsWith('pt'));
  if (ptBr.length === 0) return vozesDisponiveis[0] || null;
  // Busca nome feminino/masculino em português
  const femininas = ['Luciana','Fernanda','Maria','Helena','Google português do Brasil'];
  const masculinas = ['Felipe','Daniel','João','Google português do Brasil'];
  if (genero === 'F') {
    const v = ptBr.find(v => femininas.some(f => v.name.includes(f)));
    return v || ptBr[0];
  } else {
    const v = ptBr.find(v => masculinas.some(m => v.name.includes(m)));
    return v || ptBr[0];
  }
}

function falar(texto, avatar) {
  if (!state.voz.ativa) return;
  if (!('speechSynthesis' in window)) {
    toast('Voz não suportada neste navegador');
    return;
  }
  // Para qualquer fala em andamento
  window.speechSynthesis.cancel();

  const utter = new SpeechSynthesisUtterance(texto);
  const voz = escolherVoz(avatar.genero);
  if (voz) utter.voice = voz;
  utter.lang = 'pt-BR';
  utter.pitch = avatar.vozPitch || 1.0;
  utter.rate = avatar.vozRate || 1.0;
  utter.volume = state.voz.volume;

  // Marca visualmente o avatar como falando
  if (avatar && avatar.id) {
    marcarAvatarFalando(avatar.id, true);
    utter.onend = () => marcarAvatarFalando(avatar.id, false);
    utter.onerror = () => marcarAvatarFalando(avatar.id, false);
  }

  window.speechSynthesis.speak(utter);
}

function pararFala() {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  document.querySelectorAll('.avat.falando').forEach(el => el.classList.remove('falando'));
}

function marcarAvatarFalando(id, ativo) {
  document.querySelectorAll(`.avat[data-id="${id}"]`).forEach(el => {
    el.classList.toggle('falando', ativo);
  });
}

let recognition = null;
function iniciarReconhecimento(onTexto, onFim) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    toast('Reconhecimento de voz não suportado. Use Chrome ou Edge.');
    return null;
  }
  const rec = new SR();
  rec.lang = 'pt-BR';
  rec.continuous = false;
  rec.interimResults = true;
  let textoFinal = '';
  rec.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) textoFinal += t;
      else interim += t;
    }
    onTexto(textoFinal, interim);
  };
  rec.onerror = (e) => {
    toast('Erro de voz: ' + e.error);
  };
  rec.onend = () => {
    if (onFim) onFim(textoFinal);
  };
  rec.start();
  return rec;
}

const GROQ_URL = 'https://api.groq.com/openai/v1/chat/completions';
const GROQ_MODEL = 'openai/gpt-oss-20b';

async function perguntarIA(mensagem, contexto = '') {
  if (!state.apiKey) {
    return `[Modo offline] Configure sua chave Groq em ⚙️ Configurações.`;
  }
  const sistema = `Você é o MAESTRO — assistente musical especializado em GOSPEL CONTEMPORÂNEO.
Referências: Hillsong, Bethel, Elevation, Maverick City, Kirk Franklin, Sinach, Gabriel Guedes, Isaias Saad, MORADA, Fernandinho.
Regras:
- NUNCA avance se o aluno não entendeu 100%
- Se errar, explique de outra forma com exemplo gospel real
- Use linguagem de maestro: "Vamos ao compasso X", "Fique atento ao cruzamento de vozes"
- Ao ensinar acorde, cite notas (ex: Cmaj7 = C-E-G-B)
- Seja didático e técnico, mas acessível.
- Se sua resposta pedir um exemplo sonoro (acorde, escala, intervalo), mencione CLARAMENTE:
  "Para ouvir, clique em tocar" ou "Escute o acorde abaixo"`;

  try {
    const resp = await fetch(GROQ_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${state.apiKey}`
      },
      body: JSON.stringify({
        model: GROQ_MODEL,
        messages: [
          { role: 'system', content: sistema },
          { role: 'user', content: contexto ? `${contexto}\n\nAluno: ${mensagem}` : mensagem }
        ],
        temperature: 0.7,
        max_tokens: 800
      })
    });
    if (!resp.ok) {
      const erro = await resp.text();
      throw new Error(`HTTP ${resp.status}: ${erro.slice(0, 200)}`);
    }
    const data = await resp.json();
    return data.choices?.[0]?.message?.content || '(sem resposta)';
  } catch (e) {
    return `[Erro: ${e.message}]\n\nVerifique sua chave Groq em ⚙️ Configurações.`;
  }
}

  const mulheres = AVATARES.filter(a => a.genero === 'F');
  const homens = AVATARES.filter(a => a.genero === 'M');
  return `
    <div class="sec-title">🎙️ Laboratório por Voz</div>
    <div class="info-box">
      Clique em um avatar, fale com ele e ele responde <strong>falando em voz alta</strong>.<br>
      Use <strong>Chrome ou Edge</strong> para reconhecimento de voz.
    </div>

    <button class="voz-big-btn" id="btnVoz" onclick="falarComSelecionado()">
      🎤 Falar com o avatar selecionado
    </button>

    <div id="transcricaoBox" class="transcricao-box">
      Selecione um avatar abaixo primeiro.
    </div>

    ${state.coroAtivo.length > 0 ? `
      <div class="info-box" style="background:rgba(124,58,237,0.15);border-left:4px solid var(--primary);">
        🎙️ <strong>Coro ativo (${state.coroAtivo.length} vozes):</strong>
        <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;">
          ${state.coroAtivo.map(id => {
            const av = AVATARES.find(a => a.id === id);
            return `<span style="background:${av.cor};padding:4px 10px;border-radius:14px;font-size:11px;font-weight:700;">${av.emoji} ${av.nome}</span>`;
          }).join('')}
        </div>
        <div class="btn-row" style="margin-top:10px;">
          <button class="btn verde" onclick="falarCoro()">🎼 Coro fala cumprimento</button>
          <button class="btn vermelho" onclick="limparCoro()">🗑️ Limpar</button>
        </div>
      </div>
    ` : ''}

    <div class="sec-title">👩 Mulheres</div>
    <div class="avat-grid">
      ${mulheres.map(a => renderAvatarCard(a)).join('')}
    </div>
    <div class="sec-title">👨 Homens</div>
    <div class="avat-grid">
      ${homens.map(a => renderAvatarCard(a)).join('')}

}

function renderAvatarCard(a) {
  const ativo = state.coroAtivo.includes(a.id);
  const selecionado = state.avatarSelecionado === a.id;
  return `
    <div class="avat ${ativo ? 'ativo' : ''}" data-id="${a.id}"
         style="border-color:${selecionado ? a.cor : (ativo ? a.cor : a.cor + '40')};${selecionado ? 'box-shadow:0 0 0 3px ' + a.cor + '40;' : ''}"
         onclick="selecionarAvatar('${a.id}')">
      <div class="emoji">${a.emoji}</div>
      <div class="nome">${a.nome}</div>
      <div class="naipe" style="color:${a.cor}">${a.naipe}</div>
      <button onclick="event.stopPropagation();toggleCoro('${a.id}')" style="margin-top:6px;background:${ativo ? a.cor : 'rgba(255,255,255,0.1)'};border:none;color:white;padding:4px 10px;border-radius:8px;font-size:10px;font-weight:700;cursor:pointer;">
        ${ativo ? '✓ No coro' : '+ Coro'}
      </button>
    </div>
  `;
}

function selecionarAvatar(id) {
  state.avatarSelecionado = id;
  const av = AVATARES.find(a => a.id === id);
  document.getElementById('transcricaoBox').innerHTML = `<strong>${av.emoji} ${av.nome} selecionado.</strong> Clique em <strong>🎤 Falar</strong> e comece a falar.`;
  document.querySelectorAll('.avat').forEach(el => {
    el.style.boxShadow = '';
  });
  document.querySelectorAll(`.avat[data-id="${id}"]`).forEach(el => {
    el.style.boxShadow = `0 0 0 3px ${av.cor}40`;
  });
}

function toggleCoro(id) {
  const i = state.coroAtivo.indexOf(id);
  if (i === -1) {
    if (state.coroAtivo.length >= 6) { toast('Máximo 6 vozes'); return; }
    state.coroAtivo.push(id);
  } else {
    state.coroAtivo.splice(i, 1);
  }
  salvar();
  render();
}

function limparCoro() {
  state.coroAtivo = [];
  salvar();
  render();
}

function falarCoro() {
  if (state.coroAtivo.length === 0) { toast('Adicione avatares ao coro'); return; }
  const frase = 'Somos o coro do Maestro, prontos para ensaiar!';
  let delay = 0;
  state.coroAtivo.forEach((id, i) => {
    const av = AVATARES.find(a => a.id === id);
    setTimeout(() => falar(frase, av), delay);
    delay += 2200;
  });
  toast('🎼 Coro falando…');
}

async function falarComSelecionado() {
  if (!state.avatarSelecionado) { toast('Selecione um avatar primeiro'); return; }
  const av = AVATARES.find(a => a.id === state.avatarSelecionado);
  const box = document.getElementById('transcricaoBox');
  const btn = document.getElementById('btnVoz');

  box.className = 'transcricao-box ativa';
  box.innerHTML = `<strong>🎤 Ouvindo...</strong> fale agora`;
  btn.classList.add('gravando');
  btn.textContent = '🔴 Gravando — fale agora';

  const rec = iniciarReconhecimento(
    (final, interim) => {
      box.innerHTML = `<strong>🎤 Ouvindo:</strong> ${escapeHtml(final + ' ' + interim)}`;
    },
    async (textoFinal) => {
      btn.classList.remove('gravando');
      btn.textContent = '🎤 Falar com o avatar selecionado';
      box.className = 'transcricao-box';
      const texto = textoFinal.trim();
      if (!texto) {
        box.innerHTML = `<em>Nada foi reconhecido. Tente de novo.</em>`;
        return;
      }
      box.innerHTML = `<strong>Você disse:</strong> ${escapeHtml(texto)}`;

      // Adiciona ao histórico de chat
      state.historico[av.id] = state.historico[av.id] || [];
      state.historico[av.id].push({ autor: 'eu', texto });
      salvar();

      // Pede à IA
      toast('🤖 ' + av.nome + ' pensando…');
      const resp = await perguntarIA(texto,
        `Você é ${av.nome}, ${av.naipe} (${av.tess}). Personalidade: ${av.pers}
Responda COMO ${av.nome} numa sala de ensaio real. Seja BREVE (máx 3 frases).
Se o aluno pedir para cantar notas, responda confirmando e depois as notas serão tocadas.`
      );

      state.historico[av.id].push({ autor: 'avatar', texto: resp });
      salvar();

      // FALA a resposta em voz alta
      falar(resp, av);

      // Mostra na tela
      box.innerHTML = `
        <div style="margin-bottom:10px;"><strong>Você:</strong> ${escapeHtml(texto)}</div>
        <div class="avatar-falando-big">
          <div class="emoji-big">${av.emoji}</div>
          <div style="flex:1;">
            <div style="font-size:12px;color:#FECACA;font-weight:800;margin-bottom:4px;">🔊 ${av.nome} está falando</div>
            <div style="font-size:13px;line-height:1.5;">${escapeHtml(resp)}</div>
          </div>
          <div class="onda"><span></span><span></span><span></span><span></span><span></span></div>
        </div>
      `;

      // Detecta se a resposta pede exemplo sonoro → toca acordes automaticamente
      const matchAcorde = texto.match(/\b([A-G][#b]?)(maj7|m7|7|dim|aug|sus4|sus2)?\b/gi);
      if (matchAcorde) {
        setTimeout(() => {
          const acordeNotas = ['C4','E4','G4']; // exemplo genérico
          tocarAcorde(acordeNotas, 1.5);
        }, 1500);
      }
    }
  );
}

async function iniciarAulaFalada(num, titulo) {
  const av = AVATARES.find(a => a.id === state.avatarSelecionado);
  const box = document.getElementById('aulaFaladaBox');
  box.innerHTML = `
    <div class="info-box">
      <strong>${av.emoji} ${av.nome} vai dar aula sobre: ${titulo}</strong><br>
      Aguarde, ele está preparando…
    </div>
  `;

  const resp = await perguntarIA(
    `Dê uma aula completa sobre "${titulo}" em arranjo gospel.
Estruture em: conceito, exemplo prático com acordes reais, dica de aplicação gospel.
Máximo 250 palavras.`,
    `[Aula Falada — ${av.nome}]`
  );

  box.innerHTML = `
    <div class="info-box">
      <strong>${av.emoji} ${av.nome} — Aula sobre ${titulo}</strong>
    </div>
    <div style="background:rgba(255,255,255,0.04);padding:16px;border-radius:12px;font-size:14px;line-height:1.6;white-space:pre-wrap;">
      ${escapeHtml(resp)}

    <div class="btn-row">
      <button class="btn rosa" onclick="falarAulaCompleta()">🔊 Ouvir aula completa</button>
      <button class="btn sec" onclick="pararFala()">⏹ Parar</button>
    </div>
    <div id="aulaFaladaTexto" style="display:none;">${escapeHtml(resp)}</div>
  `;

  // Auto-falar pontos principais se contiverem termos sonoros
  const temExemplo = /acorde|escala|intervalo|nota|acorde de|escute|ouça/i.test(resp);
  if (temExemplo && state.voz.autoFalar) {
    setTimeout(() => {
      const resumo = resp.split('\n').filter(l => /acorde|escala|nota|escute|ouça/i.test(l)).slice(0, 2).join('. ');
      if (resumo) falar('Atenção: ' + resumo, av);
    }, 800);
  }
}

function falarAulaCompleta() {
  const el = document.getElementById('aulaFaladaTexto');
  if (!el) return;
  const av = AVATARES.find(a => a.id === state.avatarSelecionado);
  falar(el.textContent, av);
}

}

function executarComandoEnsaio(texto) {
  const avataresEncontrados = AVATARES.filter(a =>
    texto.toLowerCase().includes(a.nome.toLowerCase())
  );
  // Notas no formato C4, E4, G4, etc
  const notas = (texto.match(/\b[A-G][#b]?\d\b/g) || []);
  // "todos" ou "coro"
  const todos = /todos|coro inteiro|time/i.test(texto);

  if (todos || avataresEncontrados.length === 0) {
    // Aplica a todos do coro ativo
    const lista = state.coroAtivo.length > 0
      ? state.coroAtivo.map(id => AVATARES.find(a => a.id === id))
      : avataresEncontrados;

    if (lista.length === 0) {
      toast('Nenhum avatar identificado. Fale "Sara canta C4"');
      return;
    }

    const acordeFinal = notas.length > 0 ? notas : ['C4', 'E4', 'G4', 'B4'];
    lista.forEach((av, idx) => {
      const nota = acordeFinal[idx % acordeFinal.length];
      setTimeout(() => {
        falar(`Vou cantar ${nota}`, av);
        setTimeout(() => tocarNotaTimbre(notaParaFreq(nota), av.naipe, 1.2), 800);
      }, idx * 400);
    });
    toast('🎼 Coro executando…');
    return;
  }

  // Um ou mais avatares específicos
  if (notas.length === 0) {
    toast('Não identifiquei notas. Fale "Sara canta C4 E4 G4"');
    return;
  }

  avataresEncontrados.forEach((av, i) => {
    setTimeout(() => {
      const frase = `Sim maestro, vou cantar ${notas.join(' ')}`;
      falar(frase, av);
      setTimeout(() => {
        notas.forEach((n, j) => {
          setTimeout(() => tocarNotaTimbre(notaParaFreq(n), av.naipe, 0.9), j * 500);
        });
      }, 1800);
    }, i * 500);
  });
  toast(`🎼 ${avataresEncontrados.map(a => a.nome).join(', ')} vai cantar`);
}

let vozValidStream = null;
let vozValidAnalyser = null;
let vozValidRaf = null;

async function toggleValidacaoVoz() {
  if (state.validacao.ativo) {
    state.validacao.ativo = false;
    if (vozValidStream) vozValidStream.getTracks().forEach(t => t.stop());
    if (vozValidRaf) cancelAnimationFrame(vozValidRaf);
    render();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    vozValidStream = stream;
    const ctx = getAudio();
    const src = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    src.connect(analyser);
    vozValidAnalyser = analyser;
    state.validacao.ativo = true;
    render();
    loopValidacaoVoz();
  } catch (e) {
    toast('Microfone bloqueado: ' + e.message);
  }
}

function loopValidacaoVoz() {
  if (!state.validacao.ativo) return;
  const buffer = new Float32Array(vozValidAnalyser.fftSize);
  vozValidAnalyser.getFloatTimeDomainData(buffer);
  const freq = detectarPitchYIN(buffer, getAudio().sampleRate);
  if (freq > 0 && freq > 60 && freq < 1500) {
    const { nota, cents } = freqParaNota(freq);
    const elNota = document.getElementById('vozNota');
    const elCents = document.getElementById('vozCents');
    const elFreq = document.getElementById('vozFreq');
    const elMarc = document.getElementById('vozMarcador');
    const elValid = document.getElementById('vozValidacao');
    if (elNota) {
      elNota.textContent = nota;
      const cor = Math.abs(cents) < 8 ? '#10B981' : Math.abs(cents) < 25 ? '#FBBF24' : '#EF4444';
      elNota.style.color = cor;
      elCents.textContent = (cents > 0 ? '+' : '') + cents + '¢ ' + (Math.abs(cents) < 8 ? '✓' : cents > 0 ? '↓' : '↑');
      elFreq.textContent = freq.toFixed(1) + ' Hz';
      elMarc.style.left = (50 + Math.max(-50, Math.min(50, cents))) + '%';
      elMarc.style.background = cor;

      // Validação com nota-alvo
      if (state.validacao.notaAlvo) {
        const acertou = nota === state.validacao.notaAlvo;
        elValid.innerHTML = acertou
          ? `<span style="color:#10B981;">✅ Acertou! ${state.validacao.notaAlvo}</span>`
          : `<span style="color:#FBBF24;">⏺ Você está em ${nota}. Alvo: ${state.validacao.notaAlvo}</span>`;
      }
    }
  }
  vozValidRaf = requestAnimationFrame(loopValidacaoVoz);
}

function detectarPitchYIN(buffer, sr) {
  const SIZE = buffer.length;
  const MAX = Math.floor(SIZE / 2);
  const THRESH = 0.15;
  const dmf = new Float32Array(MAX);
  for (let tau = 1; tau < MAX; tau++) {
    let s = 0;
    for (let i = 0; i < MAX; i++) {
      const d = buffer[i] - buffer[i + tau];
      s += d * d;
    }
    dmf[tau] = s;
  }
  const cmndf = new Float32Array(MAX);
  cmndf[0] = 1;
  let soma = 0;
  for (let tau = 1; tau < MAX; tau++) {
    soma += dmf[tau];
    cmndf[tau] = soma === 0 ? 1 : (dmf[tau] * tau) / soma;
  }
  let tauEst = -1;
  for (let tau = 2; tau < MAX; tau++) {
    if (cmndf[tau] < THRESH) {
      while (tau + 1 < MAX && cmndf[tau + 1] < cmndf[tau]) tau++;
      tauEst = tau;
      break;
    }
  }
  if (tauEst === -1) return -1;
  const x1 = cmndf[tauEst - 1], x2 = cmndf[tauEst], x3 = cmndf[tauEst + 1];
  const a = (x1 + x3 - 2 * x2) / 2;
  const b = (x3 - x1) / 2;
  const tauRef = a === 0 ? tauEst : tauEst - b / (2 * a);
  return sr / tauRef;
}

      <button class="btn sec" onclick="pedirCantar('${id}', 'C4 E4 G4 B4')">🎵 Cantar Cmaj7</button>
      <button class="btn sec" onclick="limparChat('${id}')">🗑️ Limpar</button>
    </div>
  `;
}

function falarComSelecionadoChat(id) {
  state.avatarSelecionado = id;
  ir('lab-voz');
  setTimeout(() => falarComSelecionado(), 300);
}

function falarTextoHist(id, idx) {
  const av = AVATARES.find(a => a.id === id);
  const msg = state.historico[id][idx];
  if (msg && av) falar(msg.texto, av);
}

async function enviarChat(id) {
  const input = document.getElementById('chatInput');
  const texto = input.value.trim();
  if (!texto) return;
  const av = AVATARES.find(a => a.id === id);
  state.historico[id] = state.historico[id] || [];
  state.historico[id].push({ autor: 'eu', texto });
  salvar();
  const chat = document.getElementById('chatBox');
  chat.innerHTML += `<div class="msg eu">${escapeHtml(texto)}</div>`;
  chat.innerHTML += `<div class="msg avatar">🤖 ${av.nome} pensando…</div>`;
  chat.scrollTop = chat.scrollHeight;
  input.value = '';

  const resp = await perguntarIA(texto,
    `Você é ${av.nome}, ${av.naipe} (${av.tess}). Personalidade: ${av.pers}
Responda COMO ${av.nome}. Breve. Se for instrução musical, confirme com sua perspectiva de naipe.`
  );

  state.historico[id].push({ autor: 'avatar', texto: resp });
  salvar();
  chat.lastChild.remove();
  const msgIdx = state.historico[id].length - 1;
  chat.innerHTML += `<div class="msg avatar" data-msg="${msgIdx}">
    ${escapeHtml(resp).replace(/\n/g, '<br>')}
    <br><button class="btn-falar" onclick="falarTextoHist('${id}', ${msgIdx})">🔊 Ouvir</button>
  </div>`;
  chat.scrollTop = chat.scrollHeight;

  if (state.voz.autoFalar) falar(resp, av);
}

function pedirCantar(id, notasStr) {
  const av = AVATARES.find(a => a.id === id);
  const notas = notasStr.split(/\s+/);
  falar(`Vou cantar ${notas.join(' ')}`, av);
  setTimeout(() => {
    notas.forEach((n, i) => {
      setTimeout(() => tocarNotaTimbre(notaParaFreq(n), av.naipe, 0.9), i * 350);
    });
  }, 1600);
}

function limparChat(id) {
  state.historico[id] = [];
  salvar();
  render();
}

let metronomoTimer = null;
function toggleMetronomo() {
  const m = state.metronomo;
  if (m.rodando) { m.rodando = false; clearTimeout(metronomoTimer); }
  else { m.rodando = true; m.beat = 0; tickMetronomo(); }
  render();
}

function tickMetronomo() {
  const m = state.metronomo;
  if (!m.rodando) return;
  document.querySelectorAll('.bolinha').forEach(b => b.classList.remove('ativa', 'forte'));
  const ativa = document.getElementById('b' + m.beat);
  if (ativa) { ativa.classList.add('ativa'); if (m.beat === 0) ativa.classList.add('forte'); }
  if (m.somAtivo) tocarNota(m.beat === 0 ? 1200 : 800, 0.05, 0.2, 'square');
  m.beat = (m.beat + 1) % m.formula;
  metronomoTimer = setTimeout(tickMetronomo, 60000 / m.bpm);
}

function mudarBpm(v) { state.metronomo.bpm = parseInt(v); document.getElementById('bpmDisplay').textContent = v; }
function mudarFormula(f) { state.metronomo.formula = f; state.metronomo.beat = 0; render(); }

}

function iniciarDesafio() {
  state.desafio = { acordes: [
    { nome: 'Cmaj7', notas: ['C4','E4','G4','B4'] },
    { nome: 'Am7', notas: ['A3','C4','E4','G4'] },
    { nome: 'Dm7', notas: ['D4','F4','A4','C5'] },
    { nome: 'G7', notas: ['G3','B3','D4','F4'] },
  ]};
  render();
}

async function tocarDesafio() {
  for (const a of state.desafio.acordes) {
    await new Promise(r => setTimeout(r, 200));
    tocarAcorde(a.notas, 1.2);
    await new Promise(r => setTimeout(r, 1400));
  }
}

function respostaDesafio() {
  const d = state.desafio;
  if (!d) return;
  const acertos = d.acordes.filter(a => confirm(`Você tocou ${a.nome}?`)).length;
  const pct = Math.round((acertos / d.acordes.length) * 100);
  state.memoria.desafios.push({ pct, data: new Date().toISOString() });
  salvar();
  alert(`Resultado: ${pct}%`);
  state.desafio = null;
  render();
}

function salvarApi() {
  const v = document.getElementById('apiInput').value.trim();

  localStorage.setItem('maestro_groq_key', v);
  toast(v ? '✅ Chave Groq salva' : '⚠️ Chave removida');
}

function testarVoz() {
  const av = AVATARES[0];
  falar(`Olá! Eu sou ${av.nome}, ${av.naipe}. Esta é minha voz.`, av);
}

function limparTudo() {
  if (!confirm('Apagar todos os dados?')) return;
  localStorage.clear();
  location.reload();
}

function renderPiano(container) {
  const notas = [];
  for (let oit = 3; oit <= 5; oit++) {
    ['C','D','E','F','G','A','B'].forEach(n => notas.push(n + oit));
  }
  const pretas = { C:'C#', D:'D#', F:'F#', G:'G#', A:'A#' };
  let html = '';
  let posBranca = 0;
  notas.forEach(n => {
    html += `<div class="tecla-branca" onclick="clicarTecla('${n}', event)">${n}</div>`;
    if (pretas[n[0]]) {
      const preta = pretas[n[0]] + n[1];
      html += `<div class="tecla-preta" style="left:${posBranca * 36 + 22}px;" onclick="clicarTecla('${preta}', event)"></div>`;
    }
    posBranca++;
  });
  container.innerHTML = html;
}

function clicarTecla(nota, ev) {
  ev.stopPropagation();
  tocarNota(notaParaFreq(nota), 0.6, 0.15, 'triangle');
  ev.target.classList.add('ativa');
  setTimeout(() => ev.target.classList.remove('ativa'), 200);
}

// ==========================================================
// RENDER PRINCIPAL
// ==========================================================

function render() {
  const app = document.getElementById('app');
  const header = document.getElementById('headerTitulo');
  const btnVoltar = document.getElementById('btnVoltar');

  if (state.tela === 'home') { app.innerHTML = telaHome(); header.textContent = 'Maestro'; btnVoltar.classList.remove('ativo'); }
  else if (state.tela === 'lab-voz') { app.innerHTML = telaLabVoz(); header.textContent = '🎙️ Laboratório por Voz'; btnVoltar.classList.add('ativo'); }
  else if (state.tela === 'aula-falada') { app.innerHTML = telaAulaFalada(); header.textContent = '🔊 Aula Falada'; btnVoltar.classList.add('ativo'); }
  else if (state.tela === 'ensaio-cor') { app.innerHTML = telaEnsaioCor(); header.textContent = '🎼 Ensaio de Coro'; btnVoltar.classList.add('ativo'); }
  else if (state.tela === 'validar-voz') { app.innerHTML = telaValidarVoz(); header.textContent = '🎤 Validação'; btnVoltar.classList.add('ativo'); }
  else if (state.tela === 'piano') { app.innerHTML = telaPiano(); header.textContent = '🎹 Piano'; btnVoltar.classList.add('ativo'); }
  else if (state.tela.startsWith('aula-piano-')) {
    const n = parseInt(state.tela.replace('aula-piano-', ''));
    app.innerHTML = telaAulaPiano(n);
    header.textContent = 'Aula';
    btnVoltar.classList.add('ativo');
    setTimeout(() => { const el = document.getElementById('pianoWrapper'); if (el) renderPiano(el); }, 50);
  }
  else if (state.tela === 'arr') { app.innerHTML = telaArranjo(); header.textContent = '🎼 Arranjo'; btnVoltar.classList.add('ativo'); }
  else if (state.tela.startsWith('aula-arr-')) {
    const n = parseInt(state.tela.replace('aula-arr-', ''));
    app.innerHTML = telaAulaArr(n);
    header.textContent = 'Aula';
    btnVoltar.classList.add('ativo');
  }
  else if (state.tela === 'lab') { app.innerHTML = telaLab(); header.textContent = '👥 Laboratório'; btnVoltar.classList.add('ativo'); }
  else if (state.tela.startsWith('chat-')) {
    const id = state.tela.replace('chat-', '');
    app.innerHTML = telaChat(id);
    header.textContent = 'Chat';
    btnVoltar.classList.add('ativo');
    setTimeout(() => { const el = document.getElementById('chatBox'); if (el) el.scrollTop = el.scrollHeight; }, 50);
  }
  else if (state.tela === 'bib') { app.innerHTML = telaBiblioteca(); header.textContent = '📖 Biblioteca'; btnVoltar.classList.add('ativo'); }
  else if (state.tela === 'ferramentas') { app.innerHTML = telaFerramentas(); header.textContent = '🛠️'; btnVoltar.classList.add('ativo'); }
  else if (state.tela === 'desafio') {
    app.innerHTML = telaDesafio();
    header.textContent = '🎯';
    btnVoltar.classList.add('ativo');
    if (state.desafio) {
      const box = document.getElementById('desafioBox');
      if (box) box.innerHTML = `
        <button class="btn verde" style="width:100%;margin-bottom:8px;" onclick="tocarDesafio()">🔊 Tocar</button>
        <button class="btn" style="width:100%;" onclick="respostaDesafio()">✓ Verificar</button>
      `;
    }
  }
  else if (state.tela === 'memoria') { app.innerHTML = telaMemoria(); header.textContent = '🧠'; btnVoltar.classList.add('ativo'); }
  else if (state.tela === 'config') { app.innerHTML = telaConfig(); header.textContent = '⚙️'; btnVoltar.classList.add('ativo'); }
  else { app.innerHTML = telaHome(); header.textContent = 'Maestro'; btnVoltar.classList.remove('ativo'); }
}

// Boot
carregarVozes();
render();
setTimeout(carregarVozes, 500);
setTimeout(carregarVozes, 1500);

console.log('🎼 Maestro com voz carregado. Avatares falam, cantam e ouvem.');
</script>
